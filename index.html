<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundPods Mini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <a class="logo" href="#home">SoundPods Mini</a>
      <div>
        <a href="#features">Features</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="product" id="home">
      <img src="images/headphone.jpg" alt="A pair of wireless headphones">

      <div class="product-info">
        <h1>SoundPods Mini</h1>
        <p>Small wireless headphones with big, clear sound.</p>
        <p class="price">Rs 2500</p>
        <a class="button" href="#contact">Buy Now</a>
      </div>
    </section>

    <section class="features" id="features">
      <h2>Features</h2>
      <ul>
        <li>Wireless Bluetooth connection</li>
        <li>Comfortable, lightweight design</li>
        <li>Up to 8 hours of listening time</li>
      </ul>
    </section>

    <section class="contact" id="contact">
      <h2>Contact us</h2>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>2026 SoundPods Mini</p>
  </footer>

</body>
</html>
